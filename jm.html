<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线 jm 漫画预览 - 小泽</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        body {
            background-color: #0f1117;
            color: #e5e7eb;
            min-height: 100vh;
            padding-top: 64px;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #161922;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            z-index: 999;
            animation: fadeInUp 0.3s ease;
        }
        nav h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
        }
        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px;
            animation: fadeInUp 0.4s ease 0.1s both;
        }
        .search-bar {
            background: #1c1f26;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            transition: box-shadow 0.3s ease;
        }
        .search-bar:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        }
        #jmId {
            flex: 1;
            min-width: 180px;
            background-color: #272b33;
            border: 1px solid #333842;
            border-radius: 10px;
            color: #f0f0f0;
            padding: 12px 16px;
            font-size: 15px;
            transition: border-color 0.24s ease, box-shadow 0.24s ease;
            cursor: text;
        }
        #jmId:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        #searchBtn {
            background: linear-gradient(135deg,#2563eb,#3b82f6);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 26px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.22s ease;
        }
        #searchBtn:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }
        #searchBtn:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }
        .album-link {
            display: block;
            background: #1c1f26;
            border: 1px solid #333842;
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 14px;
            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
            text-align: center;
            transition: all 0.22s ease;
            animation: fadeInUp 0.35s ease;
        }
        .album-link:hover {
            background: #272b33;
            border-color: #3b82f6;
            color: #c7d2fe;
        }
        .cover-wrap {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInUp 0.4s ease;
        }
        .cover-img {
            max-width: 100%;
            border-radius: 14px;
            background: #181b22;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .cover-img.loaded {
            opacity: 1;
            transform: translateY(0);
        }
        .history-section {
            background: #1c1f26;
            border-radius: 18px;
            padding: 16px 24px;
            margin-bottom: 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            display: none;
        }
        .history-section.has-history {
            display: block;
            animation: fadeInUp 0.35s ease;
        }
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .history-header span {
            font-size: 13px;
            color: #9ca3af;
        }
        #clearHistory {
            background: none;
            border: none;
            color: #f87171;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        #clearHistory:hover {
            background: rgba(248,113,113,0.12);
        }
        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-tag {
            background: #272b33;
            border: 1px solid #333842;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            color: #c4c9d4;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-tag:hover {
            background: #303540;
            border-color: #3b82f6;
            color: #ffffff;
        }
        .comic-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .img-item {
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.4s ease both;
        }
        .comic-img {
            max-width: 100%;
            border-radius: 12px;
            background: #181b22;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .comic-img.loaded {
            opacity: 1;
            transform: translateY(0);
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 0;
            color: #9ca3af;
            font-size: 15px;
            animation: fadeInUp 0.3s ease;
        }
        .loading-more {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 24px 0;
            color: #9ca3af;
            font-size: 13px;
            animation: fadeInUp 0.3s ease;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333842;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        .spinner-sm {
            width: 20px;
            height: 20px;
            border: 2px solid #333842;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        .error {
            text-align: center;
            padding: 60px 0;
            color: #f87171;
            animation: fadeInUp 0.3s ease;
        }
        .end-msg {
            text-align: center;
            padding: 30px 0;
            color: #6b7280;
            font-size: 14px;
            animation: fadeInUp 0.3s ease;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px 0;
            color: #6b7280;
            font-size: 13px;
        }
        @media(max-width:600px) {
            .search-bar {
                padding: 18px;
            }
            #jmId {
                width: 100%;
            }
            #searchBtn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <h1>在线 jm 漫画预览</h1>
    </nav>
    <div class="wrap">
        <div class="search-bar">
            <input id="jmId" placeholder="请输入JM编号数字" autocomplete="off">
            <button id="searchBtn">搜索预览</button>
        </div>
        <div id="historyBox" class="history-section">
            <div class="history-header">
                <span>最近搜索</span>
                <button id="clearHistory">清空记录</button>
            </div>
            <div id="historyTags" class="history-tags"></div>
        </div>
        <div id="comicBox" class="comic-list"></div>
        <footer>小泽天天开心</footer>
    </div>

<script>
    const baseUrl = "https://cdn-msp3.jmdanjonproxy.vip/media/photos/";
    const coverBaseUrl = "https://cdn-msp2.jmapiproxy1.cc/media/albums/";
    const BATCH = 5;
    const HISTORY_KEY = 'jm_search_history';
    const MAX_HISTORY = 15;

    const jmInput = document.getElementById('jmId');
    const btn = document.getElementById('searchBtn');
    const box = document.getElementById('comicBox');
    const historyBox = document.getElementById('historyBox');
    const historyTags = document.getElementById('historyTags');
    const clearBtn = document.getElementById('clearHistory');

    let currentJm = null;
    let currentPage = 0;
    let isLoading = false;
    let noMore = false;
    let consecutiveErrors = 0;
    let sentinel = null;
    let loadingIndicator = null;

    function padPage(n) {
        return n.toString().padStart(5,'0');
    }

    // === 搜索历史 ===
    function getHistory() {
        try {
            return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        } catch(e) {
            return [];
        }
    }

    function saveHistory(jm) {
        let list = getHistory();
        list = list.filter(v => v !== jm);
        list.unshift(jm);
        if(list.length > MAX_HISTORY) list = list.slice(0, MAX_HISTORY);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        renderHistory();
    }

    function renderHistory() {
        const list = getHistory();
        if(list.length === 0) {
            historyBox.classList.remove('has-history');
            return;
        }
        historyBox.classList.add('has-history');
        historyTags.innerHTML = list.map(v =>
            `<button class="history-tag" data-jm="${v}">${v}</button>`
        ).join('');
    }

    historyTags.addEventListener('click', (e) => {
        const tag = e.target.closest('.history-tag');
        if(!tag) return;
        jmInput.value = tag.dataset.jm;
        doSearch();
    });

    clearBtn.addEventListener('click', () => {
        localStorage.removeItem(HISTORY_KEY);
        historyBox.classList.remove('has-history');
        historyTags.innerHTML = '';
    });

    // === 无限滚动 ===
    function createSentinel() {
        sentinel = document.createElement('div');
        sentinel.id = 'scrollSentinel';
        sentinel.style.height = '1px';
        box.appendChild(sentinel);
        const observer = new IntersectionObserver((entries) => {
            if(entries[0].isIntersecting && !isLoading && !noMore) {
                loadMore();
            }
        }, { rootMargin: '200px' });
        observer.observe(sentinel);
    }

    function removeSentinel() {
        if(sentinel) {
            sentinel.remove();
            sentinel = null;
        }
    }

    function doSearch() {
        const jm = jmInput.value.trim();
        if(!jm) {
            box.innerHTML = '<div class="error">请输入JM编号</div>';
            return;
        }

        currentJm = jm;
        currentPage = 0;
        isLoading = false;
        noMore = false;
        consecutiveErrors = 0;
        removeSentinel();
        hideLoadingIndicator();

        // 更新 URL 以便复制分享
        history.replaceState(null, '', `?q=${jm}`);
        box.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <span>正在加载漫画...</span>
            </div>
        `;

        saveHistory(jm);

        setTimeout(() => {
            box.innerHTML = '';
            // 原站链接
            const albumUrl = `https://18comic.vip/album/${jm}`;
            box.insertAdjacentHTML('beforeend', `
                <a class="album-link" href="${albumUrl}" target="_blank" rel="noopener">在 JM 原站查看 JM${jm} →</a>
            `);
            // 封面
            const coverUrl = `${coverBaseUrl}${jm}_3x4.jpg`;
            box.insertAdjacentHTML('beforeend', `
                <div class="cover-wrap">
                    <img class="cover-img" src="${coverUrl}" alt="JM${jm} 封面">
                </div>
            `);
            const coverImg = box.querySelector('.cover-img');
            coverImg.onload = () => coverImg.classList.add('loaded');
            coverImg.onerror = () => { coverImg.parentElement.remove(); };
            // 加载漫画页
            loadMore();
        }, 250);
    }

    function showLoadingIndicator() {
        if(loadingIndicator) return;
        loadingIndicator = document.createElement('div');
        loadingIndicator.className = 'loading-more';
        loadingIndicator.innerHTML = '<div class="spinner-sm"></div><span>加载更多...</span>';
        box.appendChild(loadingIndicator);
    }

    function hideLoadingIndicator() {
        if(loadingIndicator) {
            loadingIndicator.remove();
            loadingIndicator = null;
        }
    }

    function loadMore() {
        if(!currentJm || isLoading || noMore) return;
        isLoading = true;

        showLoadingIndicator();

        const start = currentPage + 1;
        const end = currentPage + BATCH;
        let loadedCount = 0;
        let errorCount = 0;

        for(let i = start; i <= end; i++) {
            const url = `${baseUrl}${currentJm}/${padPage(i)}.webp`;
            const div = document.createElement('div');
            div.className = 'img-item';
            div.style.animationDelay = `${(i - start) * 0.06}s`;

            const img = document.createElement('img');
            img.className = 'comic-img';
            img.loading = 'lazy';
            img.src = url;
            img.alt = `第${i}页`;

            img.onload = () => {
                img.classList.add('loaded');
                loadedCount++;
            };
            img.onerror = () => {
                div.remove();
                errorCount++;
            };

            div.appendChild(img);
            box.appendChild(div);
        }

        currentPage = end;

        setTimeout(() => {
            hideLoadingIndicator();

            if(errorCount === BATCH) {
                consecutiveErrors++;
                if(consecutiveErrors >= 2) {
                    noMore = true;
                    if(currentPage > BATCH) {
                        box.insertAdjacentHTML('beforeend', '<div class="end-msg">— 已加载全部页面 —</div>');
                    }
                }
            } else {
                consecutiveErrors = 0;
            }

            removeSentinel();
            if(!noMore) {
                createSentinel();
            }

            isLoading = false;
        }, 1500);
    }

    btn.onclick = doSearch;
    jmInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') doSearch();
    });

    // 页面加载时渲染历史记录
    renderHistory();

    // 支持 ?q=jm号 查询参数
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if(q) {
        jmInput.value = q;
        doSearch();
    }
</script>
</body>
</html>
